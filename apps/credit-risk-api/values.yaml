# Projet 1 : https://github.com/Marshall006/mlops-credit-risk
image:
  repository: ghcr.io/marshall006/credit-risk-api
  tag: sha-1e044913ea133283701446c05449b2a19dfb45b4

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

route:
  enabled: true
  hostnames: ["credit-risk.localhost"]

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true

dashboard:
  enabled: true
  file: credit-risk-api.json
