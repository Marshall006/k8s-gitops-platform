# Serveur de LLM local (profil « local » uniquement : trop lourd pour la CI).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  strategy:
    type: Recreate  # un seul pod peut monter le volume
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
# Télécharge le modèle après chaque synchronisation (hook Argo CD)
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-model
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:latest
          command: ["ollama", "pull", "qwen2.5:3b"]
          env:
            - name: OLLAMA_HOST
              value: ollama:11434
