# Traefik : point d'entrée unique du cluster (successeur choisi après l'arrêt
# d'ingress-nginx en mars 2026), configuré en mode Gateway API.
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false

# La Gateway est déclarée dans platform/gateway/ (plus lisible, versionnée)
gateway:
  enabled: false
gatewayClass:
  enabled: true
  name: traefik

# kind : le port 30080 du nœud est relié au port 80 de ta machine
service:
  spec:
    # Chart Traefik >= 41 : le type se règle dans service.spec (et non plus
    # service.type). Sur kind, un LoadBalancer resterait « en attente » pour
    # toujours et Argo CD le considérerait comme jamais prêt.
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false

# ServiceMonitor du chart désactivé : le chart refuse de le générer tant que
# Prometheus n'est pas installé (problème de l'œuf et de la poule au premier
# déploiement). Les métriques Traefik restent exposées sur le port 9100.
metrics:
  prometheus:
    serviceMonitor:
      enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
