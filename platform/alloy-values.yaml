# Grafana Alloy : collecte les logs de tous les pods et les envoie à Loki.
# (Alloy remplace Promtail, déprécié.)
controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
  configMap:
    content: |-
      // 1. Découvrir tous les pods du cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Ajouter des étiquettes lisibles pour filtrer dans Grafana
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // 3. Lire les logs via l'API Kubernetes
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // 4. Les envoyer à Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
