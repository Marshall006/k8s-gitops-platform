# Routes vers les interfaces d'administration de la plateforme
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames: ["argocd.localhost"]
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames: ["grafana.localhost"]
  rules:
    - backendRefs:
        - name: grafana
          port: 80
