# La Gateway : la « porte d'entrée » du cluster, implémentée par Traefik.
# Les applications s'y rattachent avec des HTTPRoute.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000  # port interne de l'entrée « web » de Traefik
      allowedRoutes:
        namespaces:
          from: All
