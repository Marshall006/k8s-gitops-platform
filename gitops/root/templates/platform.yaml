# --- Vague -3 : CRDs de la Gateway API (le « vocabulaire » Gateway/HTTPRoute)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: {{ .Values.charts.gatewayApi }}
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  {{- include "root.syncPolicy" . | nindent 2 }}
---
# --- Vague -2 : Traefik (contrôleur de la Gateway)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: {{ .Values.charts.traefik | quote }}
      helm:
        releaseName: traefik
        valueFiles:
          - $values/platform/traefik-values.yaml
        {{- if not .Values.platform.monitoring }}
        valuesObject:
          metrics:
            prometheus:
              serviceMonitor:
                enabled: false
        {{- end }}
    {{- include "root.valuesSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  {{- include "root.syncPolicy" . | nindent 2 }}
{{- if .Values.platform.monitoring }}
---
# --- Vague -2 : supervision (installe aussi les CRDs ServiceMonitor, PrometheusRule)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: {{ .Values.charts.kubePrometheusStack | quote }}
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/kube-prometheus-stack-values.yaml
    {{- include "root.valuesSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  {{- include "root.syncPolicy" . | nindent 2 }}
{{- end }}
---
# --- Vague -1 : la Gateway et les routes d'administration
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: platform/gateway
  destination:
    server: https://kubernetes.default.svc
  {{- include "root.syncPolicy" . | nindent 2 }}
{{- if .Values.platform.logging }}
---
