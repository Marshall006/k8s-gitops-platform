# Cluster Kubernetes local (kind = « Kubernetes IN Docker ») :
# chaque nœud est un conteneur Docker.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-platform
nodes:
  - role: control-plane
    # Le port 80 de ta machine -> port 30080 du nœud -> Traefik
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
