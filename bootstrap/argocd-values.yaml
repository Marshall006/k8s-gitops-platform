# Argo CD : installé une seule fois par bootstrap.sh, ensuite il se gère
# lui-même depuis Git (comme tout le reste).
configs:
  params:
    # TLS terminé par la Gateway (local) : l'interface est servie en HTTP
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # Permet aux « vagues » de synchronisation d'attendre qu'une application
    # soit réellement saine avant de passer à la suivante (app of apps).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

dex:
  enabled: false
notifications:
  enabled: false
